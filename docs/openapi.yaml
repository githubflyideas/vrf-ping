openapi: 3.1.0
info:
  title: vrf-ping HTTP API
  version: "1"
  summary: The API the vrf-ping web UI and the Zabbix template use.
  description: |
    Machine-readable form of [API.md](API.md); the rules there apply.
    Every `/api/` response carries `API-Version: 1`. Every error is
    `{"error", "code"}` (schema `Error`). A wrong method on a known path is
    `405` with an `Allow` header; an unknown path under `/api/` is `404`.

    "session" below means the `vrfping_session` cookie from `POST /api/login`
    when vrf-ping was started with login users; without them, anyone may call
    those endpoints. Session endpoints share five request slots; a request
    that waits 30 seconds for one gets `503` with `Retry-After: 5`.
    `GET /api/stats` is the only endpoint that takes a bearer token, and that
    token is read-only.

    `openapi_test.go` (`TestOpenAPIMatchesRoutes`) fails when this file and the
    routes the code registers differ.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: The vrf-ping instance serving this API.
tags:
  - name: pages
    description: HTML pages and static files, outside `/api/`.
  - name: auth
    description: Sign in and out.
  - name: info
    description: Version and configuration health.
  - name: routing
    description: Per-target VRF and source address.
  - name: data
    description: Targets and measurements.
security:
  - session: []
paths:
  /:
    get:
      tags: [pages]
      operationId: getIndex
      summary: The web UI.
      security: []
      responses:
        "200":
          description: The dashboard page.
          content:
            text/html: {}
        "302":
          description: Not signed in; redirects to `/login`.
          headers:
            Location:
              schema: { type: string, const: /login }
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /login:
    get:
      tags: [pages]
      operationId: getLoginPage
      summary: The sign-in page.
      security: []
      responses:
        "200":
          description: The sign-in page.
          content:
            text/html: {}
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /static/{path}:
    get:
      tags: [pages]
      operationId: getStatic
      summary: Embedded static files (the route is the prefix `/static/`).
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: File path below `/static/`; may contain `/`.
          schema: { type: string }
      responses:
        "200":
          description: The file.
          content:
            "*/*": {}
        "404":
          description: No such file (plain text, not under `/api/`).
        "405":
          description: Wrong method (plain text; not under `/api/`).
  /api/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in and get the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string }
                pass: { type: string }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`vrfping_session`; HttpOnly, SameSite=Lax, 2 hours from issue."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out; the session also ends on the server. Safe without one.
      security: []
      responses:
        "200":
          description: Signed out; the cookie is cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/version:
    get:
      tags: [info]
      operationId: getVersion
      summary: Build version.
      security: []
      responses:
        "200":
          description: Version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /api/health:
    get:
      tags: [info]
      operationId: getHealth
      summary: Whether the target lists are applied in full.
      responses:
        "200":
          description: Lines skipped at startup and the latest refused reload.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/routing-options:
    get:
      tags: [routing]
      operationId: getRoutingOptions
      summary: A target's active and saved VRF and source address.
      parameters:
        - name: target
          in: query
          required: true
          description: Target name.
          schema: { type: string }
      responses:
        "200":
          description: Routing as running, as saved, and whether a reload is pending.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [editable, target, saved_target, pending_reload]
                properties:
                  editable: { type: boolean, description: True when login users are configured. }
                  target: { $ref: "#/components/schemas/Target" }
                  saved_target: { $ref: "#/components/schemas/Target" }
                  pending_reload: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Busy" }
    put:
      tags: [routing]
      operationId: putRoutingOptions
      summary: Save a target's VRF and source address; applied by the next reload.
      description: >
        Needs login users to be configured, a browser `Origin` equal to this
        host (and `Sec-Fetch-Site: same-origin` when sent), and a JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, vrf, source_address]
              properties:
                name: { type: string, minLength: 1 }
                vrf: { type: string, description: Empty for the default table. }
                source_address: { type: string, description: Empty for automatic. }
      responses:
        "200":
          description: Saved.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [saved, pending_reload, target]
                properties:
                  saved: { type: boolean, const: true }
                  pending_reload: { type: boolean, const: true }
                  target: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/targets:
    get:
      tags: [data]
      operationId: listTargets
      summary: Every target with its last-hour and last-day summary, routing and latest probe error.
      responses:
        "200":
          description: Targets; `null` when none has history yet.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items: { $ref: "#/components/schemas/TargetItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/series:
    get:
      tags: [data]
      operationId: getSeries
      summary: Every stored round for one target in a window.
      parameters:
        - name: target
          in: query
          required: true
          schema: { type: string }
        - name: minutes
          in: query
          description: Recent window; default 360, at most 300 days. Used when `from` or `to` is missing.
          schema: { type: integer }
        - name: from
          in: query
          description: Unix seconds.
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          description: Unix seconds.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Rounds, oldest first; `null` when there are none.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items: { $ref: "#/components/schemas/Round" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503": { $ref: "#/components/responses/Busy" }
  /api/stats:
    get:
      tags: [data]
      operationId: getStats
      summary: Per-target summary of the last 5 minutes, for Zabbix.
      description: Registered only when vrf-ping runs with `--zabbix` and a token.
      security:
        - bearer: []
      responses:
        "200":
          description: Summary.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vrfping_session
    bearer:
      type: http
      scheme: bearer
      description: The read-only Zabbix token; accepted by `GET /api/stats` only.
  responses:
    BadRequest:
      description: Bad input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or bad credential.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: No login users configured, or not a same-origin browser request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such target.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MethodNotAllowed:
      description: Wrong method for this path.
      headers:
        Allow:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Request body too large.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type is not `application/json`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many failed attempts from this address.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Busy:
      description: All request slots stayed busy for 30 seconds.
      headers:
        Retry-After:
          schema: { type: integer, const: 5 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: For a person. }
        code:
          type: string
          description: For a program; fixed per status.
          enum: [bad_request, unauthorized, forbidden, not_found, method_not_allowed, conflict,
                 too_large, unsupported_media_type, rate_limited, unavailable, internal]
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    HealthReport:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        skipped_at_startup: { type: array, items: { type: string } }
        reload_error: { type: string }
        reload_error_since: { type: integer, format: int64, description: Unix seconds. }
    Target:
      type: object
      required: [name, type, host, port, pace, interval_sec]
      properties:
        vrf: { type: string }
        source_address: { type: string }
        name: { type: string }
        type: { type: string, description: "`icmp`, `tcp` or `http`." }
        host: { type: string }
        port: { type: integer }
        pace: { type: string }
        interval_sec: { type: integer }
        options: { type: object }
    Stats:
      type: object
      required: [rounds, p50, p90, p99, loss_pct, bursts]
      properties:
        rounds: { type: integer }
        p50: { type: number }
        p90: { type: number }
        p99: { type: number }
        loss_pct: { type: number }
        bursts: { type: integer }
    TargetItem:
      type: object
      required: [name, type, host, interval_sec, pace, down, vrf, source_address, last_1h, last_24h]
      properties:
        name: { type: string }
        type: { type: string }
        host: { type: string, description: "`host:port` for tcp." }
        interval_sec: { type: integer }
        pace: { type: string }
        down: { type: boolean }
        vrf: { type: string }
        source_address: { type: string }
        error: { type: string, description: Why the latest round could not probe. }
        last_1h: { $ref: "#/components/schemas/Stats" }
        last_24h: { $ref: "#/components/schemas/Stats" }
    Round:
      type: object
      required: [t, s, r, ms]
      properties:
        t: { type: integer, format: int64, description: Unix seconds. }
        s: { type: integer, description: Packets sent. }
        r: { type: integer, description: Replies received. }
        ms: { type: [array, "null"], items: { type: number } }
        b: { type: boolean, description: Flagged as a loss burst. }
        z: { type: number, description: Robust z-score behind the flag. }
        error: { type: string, description: Why the round could not probe at all. }
    StatsTarget:
      type: object
      required: [id, name, rounds, bursts, probe_errors]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        rounds: { type: integer }
        p50: { type: number }
        p90: { type: number }
        p99: { type: number }
        loss_pct: { type: number }
        bursts: { type: integer }
        up: { type: integer, enum: [0, 1] }
        probe_errors: { type: integer }
    StatsReport:
      type: object
      required: [window_sec, targets]
      properties:
        window_sec: { type: integer }
        targets: { type: array, items: { $ref: "#/components/schemas/StatsTarget" } }
