name: quality

# Keeps the router small and the OpenAPI spec valid. The spec-versus-routes
# test and the browser tests run in test.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.27.4' }
      - name: gocyclo (router stays small)
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          gocyclo -over 15 web.go stats.go
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.82.0 lint docs/openapi.yaml
