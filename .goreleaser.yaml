# GoReleaser — cross-platform tarballs. No apt/deb, no rpm, no brew tap (dropped:
# not worth the token upkeep for a secondary channel — scp-and-run is the primary path).
# Zero-dependency single binary.
version: 2

project_name: vrf-ping

before:
  hooks:
    - go test ./...

builds:
  - id: vrf-ping
    main: .
    binary: vrf-ping
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

# Tarballs for the "scp and run" crowd: the binary plus LICENSE.
archives:
  - id: tar
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    # Owner root (uid/gid 0) instead of the CI runner's 1001, so `tar -x` run as
    # root does not hand the files to whatever local account has uid 1001, and
    # does not fail on chown inside a container or user namespace.
    builds_info:
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          owner: root
          group: root

checksum:
  name_template: "SHA256SUMS"


release:
  # No owner or name here, on purpose. GoReleaser takes them from the git remote of
  # the checkout, which is the repository's real current name. The asset upload API
  # does not follow redirects (307), so a name written here that is no longer the
  # real one makes every upload fail: it did at v3.3.2 and again at v3.3.9, after
  # the repository was renamed. A name written here goes stale at the next rename.
  header: |
    ## Install

    scp a tarball below, extract, `./vrf-ping`. Zero dependencies.
